map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /admin/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /static/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /login/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /logout/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /anymarket/ { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
    location /ws/ {
        include /etc/nginx/proxy_params_inet.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://web:8000;
    }
    location /_astro/ { try_files $uri =404; }
    location / { include /etc/nginx/proxy_params_inet.conf; proxy_pass http://web:8000; }
}
