<div class="flex items-center gap-2 sm:gap-3">
  <button type="button" data-theme-toggle aria-label="Activar tema oscuro" aria-pressed="false" class="rounded-lg px-3 py-2 text-xl font-medium text-slate-700 hover:bg-slate-100 focus:outline-2 focus:outline-blue-600 dark:text-slate-200 dark:hover:bg-slate-700">☾</button>
  <details class="relative" data-user-menu>
    <summary aria-label="Menú de usuario" class="flex h-10 w-10 cursor-pointer list-none items-center justify-center rounded-full border border-slate-300 text-slate-500 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-700 [&::-webkit-details-marker]:hidden">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-7 2.18-7 4v1h14v-1c0-1.82-2.58-4-7-4Z"/></svg>
    </summary>
    <div class="absolute right-0 z-50 mt-3 w-64 max-w-[calc(100vw-2rem)] overflow-hidden rounded-lg border border-slate-200 bg-white shadow-lg dark:border-slate-600 dark:bg-slate-800">
      <div class="bg-blue-900 px-5 py-4 text-white dark:bg-blue-950">
        <p class="break-words text-base font-semibold">{{ request.user.get_full_name|default:request.user.username }}</p>
        {% if request.user.email %}<p class="mt-1 break-all text-sm text-blue-100">{{ request.user.email }}</p>{% endif %}
      </div>
      <form method="post" action="{% url 'logout' %}" class="p-2">{% csrf_token %}
        <button type="submit" class="flex w-full items-center gap-3 rounded-md px-3 py-3 text-left text-sm font-medium text-slate-700 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-slate-200 dark:hover:bg-slate-700">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 17v2h8V5h-8v2m2 5H3m0 0 3-3m-3 3 3 3"/></svg>Salir
        </button>
      </form>
    </div>
  </details>
</div>
