services:
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-inet-ivs}-app
    restart: unless-stopped
    environment: &app_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-inet-ivs}
      POSTGRES_USER: ${POSTGRES_USER:-inet_ivs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-192.168.0.8}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      IVS_SAT_DB: ${IVS_SAT_DB:-IVS_SAT}
      IVS_SAT_USER: ${IVS_SAT_USER:-}
      IVS_SAT_PASSWORD: ${IVS_SAT_PASSWORD:-}
      IVS_SAT_HOST: ${IVS_SAT_HOST:-192.168.0.8}
      IVS_SAT_PORT: ${IVS_SAT_PORT:-5432}
      SQLSERVER_DB: ${SQLSERVER_DB:-}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-192.168.0.10}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      ANYMARKET_TOKEN: ${ANYMARKET_TOKEN:-}
      ANYMARKET_ENVIRONMENT: ${ANYMARKET_ENVIRONMENT:-production}
      ANYMARKET_PLATFORM: ${ANYMARKET_PLATFORM:-INET}
      ANYMARKET_ENABLED: ${ANYMARKET_ENABLED:-false}
      ANYMARKET_TIME_ZONE: ${ANYMARKET_TIME_ZONE:-America/Santiago}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec uvicorn inet_ivs.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

  worker:
    image: ${COMPOSE_PROJECT_NAME:-inet-ivs}-app
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      web:
        condition: service_healthy
    command: celery -A inet_ivs worker --loglevel=info

  beat:
    image: ${COMPOSE_PROJECT_NAME:-inet-ivs}-app
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - celery_beat_data:/var/lib/celery
    command: celery -A inet_ivs beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inet-ivs}
      POSTGRES_USER: ${POSTGRES_USER:-inet_ivs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
